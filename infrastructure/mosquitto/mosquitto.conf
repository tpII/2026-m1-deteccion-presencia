# Mosquitto Configuration for Presence Detection Project
# Port for MQTT raw TCP
listener 1883 0.0.0.0

# WebSocket listener (optional for debugging)
listener 9001 0.0.0.0
protocol websockets

# Allow anonymous connections for local laboratory environment
allow_anonymous true

# Persistence settings
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
