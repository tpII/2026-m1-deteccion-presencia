; Caso 2 - ESP32 receptor de CSI conectado al router Wi-Fi.
; Plataforma 6.x = Arduino-ESP32 2.0.x (ESP-IDF 4.4), que trae la captura de CSI habilitada.
[env:esp32doit-devkit-v1]
platform = espressif32@6.12.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps = knolleary/PubSubClient@2.8
