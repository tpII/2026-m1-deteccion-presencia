[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino

; captura de CSI desde el router Wi-Fi
; Proyecto: Deteccion de presencia PIR vs CSI (Taller de Proyecto 2 - Grupo M1)

; 921600 baudios: cada paquete CSI son ~1-2 KB de texto; a 115200 no da abasto.
monitor_speed = 921600
upload_speed = 921600
; time     -> agrega la hora de la PC a cada linea
; log2file -> guarda todo lo recibido en un .log dentro del proyecto (para el informe)
monitor_filters = time, log2file, default

build_flags =
    -DPING_INTERVAL_MS=100    ; 10 pings/s al router = ~10 paquetes CSI/s extra
    -DFILTER_ROUTER_ONLY=1    ; 1: solo CSI de paquetes enviados por el router
